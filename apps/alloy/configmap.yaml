# Alloy-Pipeline des Public-Clusters. Ziel ist AUSSCHLIESSLICH der lokale
# Cluster — hier laeuft weder Loki noch Prometheus.
#
# Bewusst NICHT hier: loki.source.journal. Das Host-Journal bleibt beim
# NixOS-Dienst (public-cluster-nix/modules/observability/alloy-journal.nix), weil
# genau dann, wenn k3s ausfaellt, dieser Pod nicht mehr laeuft — und dann braucht
# man die Journal-Zeilen am dringendsten.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: app-alloy
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
data:
  config.alloy: |
    // ── Pod-Logs aller Namespaces ────────────────────────────────────────
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Die folgenden acht Regeln sind ZEICHENGLEICH aus
    // local-cluster-kubernetes/apps/alloy/values.yaml uebernommen. Weichen die
    // Stream-Labels zwischen beiden Clustern ab, liefert eine Grafana-Query wie
    // {app="authentik"} lautlos nur die Haelfte der Treffer.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
        action        = "replace"
        target_label  = "__tmp_controller_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__tmp_controller_name", "__meta_kubernetes_pod_name"]
        regex         = "^;*([^;]+)(;.*)?$"
        action        = "replace"
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
        regex         = "^;*([^;]+)(;.*)?$"
        action        = "replace"
        target_label  = "component"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        action        = "replace"
        target_label  = "node_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }
      rule {
        source_labels = ["namespace", "app"]
        separator     = "/"
        replacement   = "$1"
        action        = "replace"
        target_label  = "job"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }
      // Spiegelbildlich zu cluster = "local" im lokalen Alloy und zu
      // cluster = "public" im NixOS-Journal-Alloy. Ohne dieses Label liegen
      // beide Cluster im selben Stream-Namensraum.
      rule {
        action       = "replace"
        target_label = "cluster"
        replacement  = "public"
      }
    }

    // Liest die Zeilen ueber die API (pods/log). Deshalb braucht dieser Pod
    // weder einen /var/log/pods-hostPath noch runAsUser: 0 — anders als der
    // DaemonSet im lokalen Cluster.
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    // NetBird v0.71.4 schreibt native nft-Regeln in die iptables-nft-Tabelle
    // "ip filter". Der cilium-agent kann die Tabelle danach nicht mehr
    // auflisten und meldet den Abgleich alle 10 s als Fehler — gemessen
    // 2026-08-11: 234 Zeilen/h auf host-1, 188/h auf host-2. Es ist KEIN
    // Datapath-Defekt: das nft-Ruleset enthaelt 0 OLD_CILIUM-Ketten, es
    // sammelt sich also nichts an. Begruendung, warum der Datapath NICHT
    // umgebaut wird, und die Bedingung fuer den Rueckbau dieser Regel stehen
    // in public-cluster-nix/docs/hetzner-workarounds.md, Abschnitt 3.
    // Der Ausdruck verlangt BEIDE Textstellen — jeder andere
    // cilium-agent-Fehler bleibt sichtbar.
    loki.process "pods" {
      forward_to = [loki.write.central.receiver]

      stage.drop {
        expression         = "iptables rules full reconciliation failed.*is incompatible, use 'nft' tool"
        drop_counter_reason = "cilium-iptables-nft"
      }
    }

    loki.write "central" {
      endpoint {
        url = "https://loki.local.sedware.net/loki/api/v1/push"
        // Gegenstueck zur SecurityPolicy `loki-ingest` im lokalen Cluster.
        // Benutzername und Passwort sind identisch mit denen des
        // NixOS-Alloy-Dienstes (alloy-journal.nix); ein abweichender Wert
        // liefert HTTP 401 und stillen Telemetrieverlust.
        basic_auth {
          username      = "public-cluster"
          password_file = "/etc/alloy-secrets/password"
        }
      }
    }

    // ── kubelet + cAdvisor ueber den API-Server-Proxy ─────────────────────
    // Der Umweg ueber /api/v1/nodes/<n>/proxy/... spart es, :10250 auf beiden
    // Nodes fuer Pods zu oeffnen; autorisiert wird ueber nodes/proxy.
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      // Ohne diese Regel truegen beide Nodes dieselbe instance
      // (kubernetes.default.svc:443), weil das Ziel der Proxy ist und nicht der
      // Node.
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
      // kube-prometheus-stack setzt metrics_path im lokalen Cluster explizit
      // (nachgemessen an container_cpu_usage_seconds_total). Der Scraper selbst
      // erzeugt das Label nicht — ohne diese Regel fehlt es nur auf der
      // Public-Seite und Dashboard-Filter greifen dort nicht.
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics"
      }
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
      rule {
        target_label = "metrics_path"
        replacement  = "/metrics/cadvisor"
      }
    }

    // job = "kubelet" fuer beide Pfade, exakt wie im lokalen Cluster; die
    // Standard-Dashboards des kube-prometheus-stack selektieren darauf.
    // 60 s statt der lokalen 30 s: der Empfaenger ist ein Node, der bis gestern
    // 35x taeglich neu startete — die halbe Samplerate ist hier billiger als
    // eine hoehere Aufloesung.
    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      forward_to        = [prometheus.relabel.budget.receiver]
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      forward_to        = [prometheus.relabel.budget.receiver]
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "60s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
    }

    // kube-state-metrics laeuft als Sidecar und lauscht nur auf 127.0.0.1
    // (s. workload.yaml). Deshalb kein Service und keine Ingress-Regel.
    prometheus.scrape "kube_state_metrics" {
      targets         = [{__address__ = "127.0.0.1:8080"}]
      forward_to      = [prometheus.relabel.budget.receiver]
      job_name        = "kube-state-metrics"
      scrape_interval = "60s"
    }

    // cert-manager. Die Zertifikate dieses Clusters sind die Internet-Edge-
    // Zertifikate, und sie waren bis 2026-08-12 voellig ungemessen: der zentrale
    // Prometheus kannte certmanager_-Serien nur mit cluster="local". Ein
    // abgelaufenes oder haengendes Edge-Zertifikat haette also keinen Alarm
    // ausgeloest. Der Exporter laeuft ohnehin auf :9402 (104 Serien gemessen),
    // abgeholt hat ihn nur niemand.
    discovery.relabel "certmanager" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        separator     = "/"
        regex         = "cert-manager/cert-manager"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        regex         = "9402"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "certmanager" {
      targets         = discovery.relabel.certmanager.output
      forward_to      = [prometheus.relabel.budget.receiver]
      job_name        = "cert-manager"
      scrape_interval = "60s"
    }

    // CNPG-Instanzmetriken. Dieser Cluster sichert in denselben rustfs-Bucket
    // wie der lokale, und am 2026-08-10 scheiterte seine Nachtsicherung, ohne
    // dass ein Alarm entstand — Postgres-Metriken verliessen den Cluster bisher
    // ueberhaupt nicht. Der Exporter laeuft ohnehin im Instance-Manager auf
    // :9187; abgeholt hat ihn nur niemand.
    discovery.relabel "cnpg" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_cnpg_io_podRole"]
        regex         = "instance"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    }

    prometheus.scrape "cnpg" {
      targets         = discovery.relabel.cnpg.output
      forward_to      = [prometheus.relabel.budget.receiver]
      job_name        = "cnpg"
      scrape_interval = "60s"
    }

    // Envoy-Proxy-Datenebene. Dies ist die einzige Internetkante des Bestands,
    // und ihre Request-Metriken verliessen den Cluster bisher nicht: 5xx-Rate
    // und Latenz von :443 waren nicht alarmierbar.
    //
    // An der EnvoyProxy-Ressource ist NICHTS zu aendern —
    // telemetry.metrics.prometheus ist in Envoy Gateway per Default aktiv. Live
    // geprueft auf host-1: hostPort 19001 (Portname "metrics"),
    // `curl 127.0.0.1:19001/stats/prometheus` liefert HTTP 200 mit 4878
    // envoy_-Reihen. Der Admin auf 127.0.0.1:19000 ist NICHT der Metrikpfad,
    // und `/metrics` gibt es auf :19001 nicht.
    //
    // Der Envoy-Gateway-CONTROLLER liegt im selben Namespace und hat ebenfalls
    // einen Port 19001 — aber unter /metrics. Er traegt kein
    // app.kubernetes.io/managed-by, die erste Regel schliesst ihn deshalb aus;
    // sonst haette der Job ein Ziel mit HTTP 404 und dauerhaft up=0.
    discovery.relabel "envoy" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_managed_by"]
        separator     = "/"
        regex         = "envoy-gateway-system/envoy-gateway"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        regex         = "19001"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      // Die Pod-Namen des DaemonSets wechseln bei jedem Rollout; der Node ist
      // das stabile Merkmal, an dem die beiden Kanten unterscheidbar bleiben.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "envoy" {
      targets         = discovery.relabel.envoy.output
      forward_to      = [prometheus.relabel.budget.receiver]
      job_name        = "envoy-proxy"
      metrics_path    = "/stats/prometheus"
      scrape_interval = "60s"
    }

    // ── Serienbudget ─────────────────────────────────────────────────────
    // Der empfangende Prometheus haelt ~332k Serien auf einem Node mit 30 GiB
    // RAM und startete deswegen im 31-Minuten-Takt neu. Es verlassen deshalb nur
    // die Metriken den Cluster, die die Standard-Dashboards des
    // kube-prometheus-stack wirklich auswerten. Jeder Name unten wurde gegen
    // `group by(__name__)` der laufenden lokalen Instanz geprueft; das naheliegende
    // kube_pod_container_status_waiting_reason steht absichtlich NICHT hier, weil
    // es das im Local-Cluster nicht gibt.
    //
    // Fuer kubelet_volume_stats_* galt dieselbe Begruendung — und sie war falsch:
    // gemessen an der LOKALEN Instanz (dort nur hostPath-PVs, also wirklich keine
    // Serie), waehrend der Public-kubelet sie fuer die eine CSI-PVC sehr wohl
    // liefert. Die vier KubePersistentVolume*FillingUp-Regeln standen deshalb ohne
    // Eingangsserie da und taeuschten Abdeckung vor. Wer hier etwas streicht, misst
    // am Public-kubelet, nicht am lokalen Prometheus.
    prometheus.relabel "budget" {
      forward_to = [prometheus.remote_write.central.receiver]

      rule {
        source_labels = ["__name__"]
        action        = "keep"
        regex = "up" +
          "|container_cpu_usage_seconds_total" +
          "|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total" +
          "|container_memory_working_set_bytes|container_memory_rss|container_memory_cache" +
          "|container_network_(receive|transmit)_bytes_total" +
          "|container_fs_(reads|writes)_bytes_total" +
          "|kubelet_running_(pods|containers)" +
          "|kube_pod_(info|owner|status_phase|status_reason)" +
          "|kube_pod_container_(info|resource_requests|resource_limits)" +
          "|kube_pod_container_status_(ready|restarts_total|waiting|last_terminated_reason)" +
          "|kube_node_(info|spec_unschedulable)" +
          "|kube_node_status_(condition|allocatable|capacity)" +
          "|kube_replicaset_owner" +
          "|kube_deployment_(spec_replicas|status_replicas_available|status_replicas_ready)" +
          "|kube_statefulset_(replicas|status_replicas_ready)" +
          "|kube_daemonset_status_(desired_number_scheduled|number_ready)" +
          "|kube_job_status_(failed|succeeded)" +
          "|kube_namespace_status_phase" +
          "|kube_persistentvolumeclaim_(status_phase|resource_requests_storage_bytes)" +
          // Der Public-Cluster hat genau EINE CSI-PVC (app-authentik/authentik-media,
          // smb.csi.k8s.io, StorageClass public-shared-bulk). Der kubelet auf host-2
          // liefert dafuer sechs kubelet_volume_stats_-Serien — sie sind die
          // Eingangsserie der vier KubePersistentVolume*FillingUp-Regeln. Sechs
          // Serien gegen ein Budget von ~332k.
          "|kubelet_volume_stats_((available|capacity|used)_bytes|inodes(_free|_used)?)" +
          // Genau die beiden Serien, auf denen die Sicherungs-Alarme im
          // lokalen Grafana stehen (monitoring/values.yaml, Gruppe
          // `sicherungs-alarme`). Von den 37 cnpg_-Metriken der Instanz
          // verlassen nur diese den Cluster: zwei Serien gegen ein Budget von
          // ~332k.
          "|cnpg_pg_stat_archiver_seconds_since_last_archival" +
          "|cnpg_collector_last_failed_backup_timestamp" +
          // Zertifikatsablauf am Internet-Edge. Zwei Namen, fuenf Zertifikate.
          "|certmanager_certificate_expiration_timestamp_seconds" +
          "|certmanager_certificate_ready_status" +
          // Ohne diese Serien koennen die mitgelieferten Chart-Alarme fuer
          // Deployments, StatefulSets, DaemonSets und Jobs im Public-Cluster
          // NIE feuern — sie stehen namentlich im Regelwerk, fanden hier aber
          // keine Daten. Betroffen sind unter anderem KubeDeploymentReplicasMismatch,
          // KubeStatefulSetUpdateNotRolledOut und KubeJobFailed.
          "|kube_deployment_status_replicas_updated" +
          "|kube_statefulset_status_(replicas|replicas_updated|current_revision|update_revision)" +
          "|kube_daemonset_status_current_number_scheduled" +
          "|kube_job_failed|kube_job_status_start_time" +
          // Die einzige Internetkante. envoy_http_downstream_rq_xx traegt die
          // 5xx-Rate je Listener, _time_(sum|count) die mittlere Latenz,
          // envoy_cluster_upstream_rq_(xx|timeout) ordnet einen Fehler der
          // HTTPRoute zu und trennt Route-Timeout von Backend-Fehler.
          // Gemessen 63 Reihen je Proxy-Pod, also ~126 gegen ein Budget von
          // ~332k. Die _bucket-Reihen bleiben draussen — dieselbe Entscheidung
          // wie beim PodMonitor `envoy-proxy` im lokalen Cluster; allein
          // envoy_http_downstream_rq_time_bucket waeren 200 weitere Reihen.
          "|envoy_http_downstream_rq_xx" +
          "|envoy_http_downstream_rq_time_(sum|count)" +
          "|envoy_cluster_upstream_rq_xx|envoy_cluster_upstream_rq_timeout"
      }

      // cAdvisor liefert dieselben container_*-Namen auch fuer die Cgroups des
      // Hosts (id="/", "/system.slice/..."). Die tragen kein pod-Label, sind in
      // keinem Pod-Dashboard sichtbar und verdoppeln die cAdvisor-Serien
      // beinahe. Host-CPU/RAM liefert ohnehin der node_exporter im
      // NixOS-Alloy-Dienst.
      rule {
        source_labels = ["__name__", "pod"]
        separator     = "@"
        regex         = "container_.*@"
        action        = "drop"
      }
    }

    prometheus.remote_write "central" {
      endpoint {
        url = "https://prometheus.local.sedware.net/api/v1/write"
        // Gegenstueck zur SecurityPolicy `prometheus-ingest`; dieselbe
        // Credential wie oben bei Loki und im NixOS-Alloy-Dienst.
        basic_auth {
          username      = "public-cluster"
          password_file = "/etc/alloy-secrets/password"
        }
      }
      // Uebernommen aus alloy-journal.nix: ohne wal-Block gilt
      // max_keepalive_time = 8h, und nach einer Stoerung spielt Alloy
      // stundenalten WAL-Inhalt nach, den der Receiver als out-of-bounds
      // verwirft — Last ohne Nutzen.
      wal {
        truncate_frequency = "1h"
        min_keepalive_time = "5m"
        max_keepalive_time = "2h"
      }
      // host bleibt hier bewusst weg: diese Serien sind clusterweit, nicht
      // hostgebunden. Der Node steht im node-Label.
      external_labels = {
        cluster = "public",
      }
    }
