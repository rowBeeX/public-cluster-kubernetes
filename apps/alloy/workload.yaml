apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: app-alloy
  annotations: {argocd.argoproj.io/sync-wave: "-4"}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: apps
    serviceAccount: alloy
    audiences: [vault]
---
# Basic-Auth-Passwort fuer Loki-Push und Prometheus-Remote-Write im lokalen
# Cluster. Dieselbe Credential, die der NixOS-Alloy-Dienst auf beiden Hosts aus
# SOPS (`observability/alloy_ingest_password`) liest; die Empfaengerseite haelt
# davon die {SHA}-htpasswd-Zeile. Hier wird der KLARTEXT gebraucht, weil Alloy
# ihn als Basic-Auth-Passwort sendet.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alloy-ingest
  namespace: app-alloy
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  type: kv-v2
  mount: secret
  path: apps/app-alloy/ingest
  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: alloy-ingest
    overwrite: true
    type: Opaque
    transformation:
      excludeRaw: true
      includes: [password]
    labels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/part-of: public-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alloy, namespace: app-alloy}
spec:
  # Deployment mit einer Replik, KEIN DaemonSet: Pod-Logs kommen ueber die
  # Kubernetes-API und kubelet/cAdvisor ueber den API-Server-Proxy — beides
  # node-uebergreifend. Ein Agent pro Node wuerde jede Logzeile doppelt nach Loki
  # schicken und fuer jede Node-Serie zwei Remote-Write-Sender mit identischen
  # Labels erzeugen (der Empfaenger verwirft das zweite Sample als Duplikat).
  # Das Host-Journal, das echte Node-Praesenz braucht, liegt ohnehin beim
  # NixOS-Dienst.
  replicas: 1
  # Aus demselben Grund Recreate: waehrend eines RollingUpdate liefen zwei Alloys
  # gleichzeitig und wuerden Logs doppeln.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
      annotations: {kubectl.kubernetes.io/default-container: alloy}
    spec:
      serviceAccountName: alloy
      # Kein nodeSelector und keine tolerations: beide Public-Nodes sind
      # untainted (nachgeprueft: `kubectl get nodes -o jsonpath=…spec.taints` ist
      # auf beiden leer). Der Pod darf ueberall laufen, damit der Ausfall von
      # Host 1 die Telemetrie nicht mitnimmt.
      securityContext:
        # Das grafana/alloy-Image setzt KEIN USER und liefe sonst als root, was
        # der Namespace mit enforce: restricted ablehnt. 473 ist die im Image
        # angelegte alloy-UID; die beiden Sidecars brauchen keinen eigenen
        # Benutzer. fsGroup macht das emptyDir und das Secret fuer 473 lesbar.
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: {type: RuntimeDefault}
      containers:
      # Host 2 ist aarch64. Der Digest muss deshalb der MULTI-ARCH-INDEX sein,
      # nicht der amd64-Child-Digest, den local-cluster-kubernetes verwendet
      # (dort ist der einzige Node amd64). Verwechslung = ImagePullBackOff genau
      # dann, wenn der Pod auf Host 2 landet.
      - name: alloy
        image: docker.io/grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/tmp/alloy
        # 0.0.0.0 statt des Defaults 127.0.0.1, weil sonst weder die
        # Readiness-Probe des kubelets noch der Reloader-Sidecar den Endpunkt
        # erreicht. Nach aussen ist der Port durch Default-Deny und das Fehlen
        # eines Service verschlossen.
        - --server.http.listen-addr=0.0.0.0:12345
        - --stability.level=generally-available
        # Ohne das versucht Alloy periodisch, Nutzungsdaten an stats.grafana.org
        # zu senden. Die CiliumNetworkPolicy blockt das, der Fehler landet aber
        # in genau den Logs, die dieser Pod einsammelt.
        - --disable-reporting
        ports:
        - {name: http, protocol: TCP, containerPort: 12345}
        # Alloy startet auch mit kaputter Konfiguration weiter; /-/ready wird
        # dann nicht gruen. Erst dadurch faellt die App in ArgoCD auf Degraded
        # statt still nichts mehr zu liefern.
        readinessProbe:
          httpGet: {path: /-/ready, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/alloy, readOnly: true}
        - {name: ingest, mountPath: /etc/alloy-secrets, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      # Sidecar statt eigenem Deployment + Service: einziger Konsument ist der
      # Alloy im selben Pod. Das spart Service, Ingress-Policy und einen zweiten
      # Pod; --host/--telemetry-host binden auf 127.0.0.1, damit die Metriken den
      # Pod nicht verlassen.
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0@sha256:6b2f0b6f2f86ac5b1aa883a033a8dd55bb96c16d191ec973393bdaadaddac914
        args:
        - --host=127.0.0.1
        - --telemetry-host=127.0.0.1
        # Serienbudget an der Quelle: die Default-Ressourcenliste enthaelt unter
        # anderem leases, endpointslices, configmaps und secrets — zusammen ein
        # Vielfaches der hier gebrauchten Serien. replicasets steht bewusst drin,
        # weil kube_replicaset_owner die Kette Pod -> ReplicaSet -> Deployment
        # schliesst, ohne die die Workload-Dashboards leer bleiben.
        - --resources=daemonsets,deployments,jobs,namespaces,nodes,persistentvolumeclaims,pods,replicasets,statefulsets
        resources:
          requests: {cpu: 25m, memory: 96Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
      # Alloy laedt seine Konfiguration nur beim Start oder auf POST /-/reload.
      # Ohne diesen Sidecar wuerde ein ArgoCD-Sync die ConfigMap aendern und der
      # Pod liefe still mit der alten Pipeline weiter. Gleiches Muster wie im
      # lokalen Cluster (dort vom Alloy-Chart erzeugt).
      - name: config-reloader
        image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.0@sha256:0ccb22ca9f3f6fd9f76ce95585d18bd2e363d421c534dde710be4bd13caa551d
        args:
        - --watched-dir=/etc/alloy
        - --watched-dir=/etc/alloy-secrets
        - --reload-url=http://127.0.0.1:12345/-/reload
        resources:
          requests: {cpu: 10m, memory: 24Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/alloy, readOnly: true}
        - {name: ingest, mountPath: /etc/alloy-secrets, readOnly: true}
      volumes:
      - name: config
        configMap: {name: alloy-config}
      - name: ingest
        secret: {secretName: alloy-ingest}
      # WAL und Log-Positionen. Bewusst fluechtig: ein PVC wuerde den Pod an
      # einen Node binden und damit den Vorteil des Deployments aufheben.
      - name: tmp
        emptyDir: {sizeLimit: 512Mi}
