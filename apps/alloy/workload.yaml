apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: app-alloy
  annotations: {argocd.argoproj.io/sync-wave: "-4"}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: apps
    serviceAccount: alloy
    audiences: [vault]
---
# Klartext-Basic-Auth fuer Loki-Push und Prometheus-Remote-Write im lokalen
# Cluster; Quelle der Wahrheit und Fehlerbild siehe README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alloy-ingest
  namespace: app-alloy
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  type: kv-v2
  mount: secret
  path: apps/app-alloy/ingest
  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: alloy-ingest
    overwrite: true
    type: Opaque
    transformation:
      excludeRaw: true
      includes: [password]
    labels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/part-of: public-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alloy, namespace: app-alloy}
spec:
  # Eine Replik und Recreate, KEIN DaemonSet: beide Quellen sind
  # node-uebergreifend, ein zweiter Agent doppelte jede Logzeile (README.md).
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: alloy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy}
      annotations: {kubectl.kubernetes.io/default-container: alloy}
    spec:
      serviceAccountName: alloy
      # Kein nodeSelector: der Pod darf ueberall laufen, damit ein Ausfall von
      # Host 1 die Telemetrie nicht mitnimmt.
      securityContext:
        # Das grafana/alloy-Image setzt KEIN USER und liefe sonst als root. 473
        # ist die im Image angelegte alloy-UID; fsGroup macht emptyDir und
        # Secret fuer sie lesbar.
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: {type: RuntimeDefault}
      containers:
      # Host 2 ist aarch64: der Digest MUSS der Multi-Arch-Index sein, nicht der
      # amd64-Child-Digest aus local-cluster-kubernetes.
      - name: alloy
        image: docker.io/grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/tmp/alloy
        # 0.0.0.0 statt 127.0.0.1: sonst erreichen weder Readiness-Probe noch
        # Reloader-Sidecar den Endpunkt. Nach aussen deckt Default-Deny ab.
        - --server.http.listen-addr=0.0.0.0:12345
        # Die Referenzdoku markiert den wal-Block von loki.write als
        # experimentelles Feature; das Binary v1.18.1 setzt das NICHT durch
        # (nachgemessen, README.md). Die Stufe bleibt trotzdem gesetzt: sie
        # haelt die Konfiguration lauffaehig, falls eine kuenftige Version das
        # Doku-Label doch erzwingt -- ein abgewiesener wal-Block liesse Alloy
        # gar nicht starten und riss damit genau die Telemetrie mit, die der
        # Block schuetzt. Keine der acht verwendeten Komponenten adressiert
        # experimentelle Syntax, die dadurch zusaetzlich erreichbar wuerde.
        - --stability.level=experimental
        # Sonst schickt Alloy Nutzungsdaten an stats.grafana.org; die
        # CiliumNetworkPolicy blockt das und der Fehler flutet die eigenen Logs.
        - --disable-reporting
        ports:
        - {name: http, protocol: TCP, containerPort: 12345}
        # Alloy laeuft auch mit kaputter Konfiguration weiter; ohne diese Probe
        # bliebe die App in ArgoCD gruen und lieferte still nichts.
        readinessProbe:
          httpGet: {path: /-/ready, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/alloy, readOnly: true}
        - {name: ingest, mountPath: /etc/alloy-secrets, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      # Sidecar statt eigenem Deployment: einziger Konsument ist der Alloy im
      # selben Pod, deshalb binden --host/--telemetry-host auf 127.0.0.1.
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
        args:
        - --host=127.0.0.1
        - --telemetry-host=127.0.0.1
        # Serienbudget an der Quelle (README.md). replicasets steht bewusst
        # drin: ohne kube_replicaset_owner bleiben die Workload-Dashboards leer.
        # cronjobs seit 2026-08-22 dazu: ohne dieses Resource liefert
        # kube-state-metrics keine Serie kube_cronjob_status_last_successful_time,
        # und sedware-vault-snapshot-missing-public
        # (local-cluster-kubernetes/apps/monitoring/values.yaml) kann per
        # Konstruktion nie gruen werden. Kosten, nachgemessen an der lokalen
        # Instanz (count by(__name__) je CronJob): zehn Metrikfamilien je
        # CronJob. Der Public-Cluster traegt zwei CronJobs (descheduler, live;
        # vault-raft-snapshot, in Auslieferung ueber public-cluster-nix) --
        # macht 20 zusaetzliche Serien am Scrape, gegen ~332k Budget
        # vernachlaessigbar. Nur eine der zehn Familien verlaesst den Cluster
        # (configmap.yaml, prometheus.relabel "budget"):
        # kube_cronjob_status_last_successful_time, also 2 der 20 Serien.
        - --resources=cronjobs,daemonsets,deployments,jobs,namespaces,nodes,persistentvolumeclaims,pods,replicasets,statefulsets
        resources:
          requests: {cpu: 25m, memory: 96Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
      # Alloy laedt seine Konfiguration nur beim Start oder auf POST /-/reload.
      # Ohne diesen Sidecar liefe der Pod nach einem ArgoCD-Sync still mit der
      # alten Pipeline weiter.
      - name: config-reloader
        image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.1@sha256:428f088fe6fe07ab138bda92113664b04848a1dc408e4d3680a60ecdb55d1a65
        args:
        - --watched-dir=/etc/alloy
        - --watched-dir=/etc/alloy-secrets
        - --reload-url=http://127.0.0.1:12345/-/reload
        resources:
          requests: {cpu: 10m, memory: 24Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - {name: config, mountPath: /etc/alloy, readOnly: true}
        - {name: ingest, mountPath: /etc/alloy-secrets, readOnly: true}
      volumes:
      - name: config
        configMap: {name: alloy-config}
      - name: ingest
        secret: {secretName: alloy-ingest}
      # WAL und Log-Positionen. Bewusst fluechtig: ein PVC bände den Pod an
      # einen Node und höbe den Vorteil des Deployments auf.
      # 1Gi statt vormals 512Mi: max_segment_age = 6h in configmap.yaml soll
      # eine mehrstuendige Streckenstoerung ueberbruecken. Gemessen an Loki
      # (sum(bytes_over_time({cluster="public"}[1h])), 7-Tage-Fenster,
      # 2026-08-21): das schlechteste zusammenhaengende 6h-Fenster lud 297 MiB
      # Rohtext, Einzelspitze 58 MiB/h. 512Mi liess dafuer nur ~40 % Puffer --
      # ohne Reserve fuer WAL-Framing-Overhead und das im selben Verzeichnis
      # liegende WAL von prometheus.remote_write. Ueberschreitet das Volumen
      # sizeLimit, evictet der Kubelet den Pod statt sauber zurueckzudrosseln
      # und reisst damit auch die Metrik-Sammlung mit -- genau der Ausfall,
      # den der wal-Block verhindern soll. 1Gi haelt gegen die gemessene
      # Spitze das Dreifache vor; Host 2 hat 56 GiB freien Node-Speicher.
      - name: tmp
        emptyDir: {sizeLimit: 1Gi}
