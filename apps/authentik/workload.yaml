apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: authentik-media, namespace: app-authentik}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: public-shared-bulk
  resources:
    requests: {storage: 10Gi}
---
# Vault-Self-Service-Identität, über die authentik-db das von app-postgresql am
# gemeinsamen Pfad veröffentlichte Datenbankpasswort lesen darf.
apiVersion: v1
kind: ServiceAccount
metadata: {name: authentik-vault, namespace: app-authentik}
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata: {name: vault, namespace: app-authentik}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: apps
    serviceAccount: authentik-vault
    audiences: [vault]
---
# PostgreSQL läuft im zentralen CNPG-Cluster app-postgresql. Authentik erhält
# sein Datenbankpasswort aus dem dort veröffentlichten gemeinsamen Vault-Pfad.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata: {name: authentik-db, namespace: app-authentik}
spec:
  type: kv-v2
  mount: secret
  path: apps/app-postgresql/shared/app-authentik/db
  refreshAfter: 1h
  vaultAuthRef: vault
  destination:
    create: true
    name: authentik-db
    overwrite: true
    type: Opaque
    transformation:
      excludeRaw: true
      includes: [password]
---
apiVersion: v1
kind: Service
metadata: {name: authentik, namespace: app-authentik}
spec:
  selector: {app.kubernetes.io/name: authentik, app.kubernetes.io/component: server}
  ports:
  - {name: http, port: 9000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: authentik-server, namespace: app-authentik}
spec:
  # Das einzige Backend ist Single-Replica und ohne Failover: der CNPG-Cluster
  # läuft mit instances: 1 knotenlokal auf Host 1. Weitere Server-Repliken
  # überstünden einen Ausfall von Host 1 daher trotzdem nicht und suggerierten
  # nur HA. Ein Rollout unterbricht SSO im Cluster kurzzeitig.
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: authentik, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: authentik, app.kubernetes.io/component: server}
    spec:
      automountServiceAccountToken: false
      # BEWUSST WEG vom Datenbank-Knoten: die frühere Bindung an den
      # Control-Plane-Node lud host-1 alles auf, was nicht durch ein Volume
      # dort festgenagelt ist. Authentik ist frei verschiebbar -- sein
      # einziges Volume `authentik-media` liegt als ReadWriteMany auf der
      # SMB-Storage-Box, nicht knotenlokal. Messwerte: README.md.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cnpg.io/cluster: postgres
            # ZWINGEND: `labelSelector` in podAntiAffinity durchsucht per
            # Default NUR den eigenen Namespace. Ohne diese Zeile findet die
            # Regel in app-authentik gar keinen postgres-Pod, ist
            # damit trivial erfuellt und der Scheduler platziert frei -- genau
            # das passierte beim ersten Rollout.
            namespaces: [app-postgresql]
            topologyKey: kubernetes.io/hostname
      # Das Image bringt USER 1000 (authentik) mit; runAsUser nagelt das fest,
      # damit ein Image-Update die Media-PVC nicht mit fremder UID beschreibt.
      # Kein fsGroup: `public-shared-bulk` ist SMB mit `noperm,file_mode=0777`,
      # dort löst fsGroup nur ein rekursives chgrp über die Freigabe aus.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: authentik
        image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
        args: [server]
        envFrom:
        - secretRef: {name: authentik-runtime}
        env:
        - {name: AUTHENTIK_POSTGRESQL__HOST, value: postgres-rw.app-postgresql.svc.cluster.local}
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom: {secretKeyRef: {name: authentik-db, key: password}}
        - {name: AUTHENTIK_POSTGRESQL__USER, value: authentik}
        - {name: AUTHENTIK_POSTGRESQL__NAME, value: authentik}
        - {name: AUTHENTIK_LISTEN__HTTP, value: "0.0.0.0:9000"}
        # Nur Schema und Host, kein Pfad -- auch wenn Authentik unter einem
        # Unterpfad liegt. Ab 2026.11 ist die Einstellung Pflicht; ohne sie
        # leitet Authentik aus dem Host-Header ab, was hinter dem Envoy-Edge
        # falsch sein kann. Server und Worker brauchen denselben Wert: der
        # Worker baut die Links in E-Mails.
        - {name: AUTHENTIK_WEB__BASE_URL, value: "https://authentik.sedware.net"}
        - {name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS, value: "true"}
        - {name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true"}
        - {name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false"}
        # Es werden ausschließlich OIDC-Provider verwendet. Ohne Proxy-Outpost
        # sind Embedded-Outpost und Kubernetes-Discovery unnötig und würden
        # im abgeschotteten Cluster dauerhaft externe/API-Verbindungen versuchen.
        - {name: AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST, value: "true"}
        - {name: AUTHENTIK_OUTPOSTS__DISCOVER, value: "false"}
        ports:
        - {name: http, containerPort: 9000}
        readinessProbe:
          httpGet: {path: /-/health/ready/, port: http}
          initialDelaySeconds: 20
          periodSeconds: 10
          # Liveness/Startup sind bereits getunt; nur Readiness stand auf dem
          # 1s-Default und lief unter Last ab (context deadline exceeded).
          timeoutSeconds: 5
        # Bei einer frischen Datenbank führt der erste Pod vor dem Start alle
        # Migrationen aus. Die startupProbe hält die livenessProbe zurück, damit
        # eine langsame First-Boot-Migration nicht unterbrochen wird. 60×10s
        # erlauben höchstens zehn Minuten.
        startupProbe:
          httpGet: {path: /-/health/ready/, port: http}
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
        livenessProbe:
          exec: {command: [ak, healthcheck]}
          initialDelaySeconds: 60
          periodSeconds: 30
          # `ak healthcheck` startet einen Python-Prozess; das Standard-Timeout
          # von einer Sekunde läuft unter Last ab und löst sonst einen Crashloop aus.
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests: {cpu: 150m, memory: 384Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: media, mountPath: /media}
        - {name: blueprint, mountPath: /blueprints/custom, readOnly: true}
      volumes:
      - name: media
        persistentVolumeClaim: {claimName: authentik-media}
      - name: blueprint
        secret: {secretName: authentik-blueprint}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: authentik-worker, namespace: app-authentik}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: authentik, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: authentik, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      # Derselbe Knoten wie der Server, siehe Deployment oben.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cnpg.io/cluster: postgres
            # ZWINGEND: `labelSelector` in podAntiAffinity durchsucht per
            # Default NUR den eigenen Namespace. Ohne diese Zeile findet die
            # Regel in app-authentik gar keinen postgres-Pod, ist
            # damit trivial erfuellt und der Scheduler platziert frei -- genau
            # das passierte beim ersten Rollout.
            namespaces: [app-postgresql]
            topologyKey: kubernetes.io/hostname
      # Siehe Deployment oben.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: authentik
        image: ghcr.io/goauthentik/server:2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
        args: [worker]
        envFrom:
        - secretRef: {name: authentik-runtime}
        env:
        - {name: AUTHENTIK_POSTGRESQL__HOST, value: postgres-rw.app-postgresql.svc.cluster.local}
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom: {secretKeyRef: {name: authentik-db, key: password}}
        - {name: AUTHENTIK_POSTGRESQL__USER, value: authentik}
        - {name: AUTHENTIK_POSTGRESQL__NAME, value: authentik}
        - {name: AUTHENTIK_LISTEN__HTTP, value: "0.0.0.0:9000"}
        # Siehe Server-Deployment oben.
        - {name: AUTHENTIK_WEB__BASE_URL, value: "https://authentik.sedware.net"}
        - {name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS, value: "true"}
        - {name: AUTHENTIK_DISABLE_UPDATE_CHECK, value: "true"}
        - {name: AUTHENTIK_ERROR_REPORTING__ENABLED, value: "false"}
        - {name: AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST, value: "true"}
        - {name: AUTHENTIK_OUTPOSTS__DISCOVER, value: "false"}
        resources:
          requests: {cpu: 100m, memory: 384Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: media, mountPath: /media}
        - {name: blueprint, mountPath: /blueprints/custom, readOnly: true}
      volumes:
      - name: media
        persistentVolumeClaim: {claimName: authentik-media}
      - name: blueprint
        secret: {secretName: authentik-blueprint}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: authentik, namespace: app-authentik}
spec:
  parentRefs:
  - {name: public, namespace: gateway-system, sectionName: https}
  hostnames: [authentik.sedware.net]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: authentik, port: 9000}
