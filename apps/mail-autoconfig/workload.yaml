# Statische Mozilla-/Thunderbird-Autoconfig-Datei (RFC-lose De-facto-Standard,
# von Nextcloud Mail, Thunderbird, K-9 u. a. per "https://autoconfig.<domain>/
# mail/config-v1.1.xml" abgefragt), damit "Auto Setup" nur mit der E-Mail-
# Adresse funktioniert. Der eigentliche Mailserver (stalwart.local.sedware.net)
# bleibt NetBird/LAN-only -- diese Datei nennt nur öffentlich ohnehin bekannte
# Fakten (vergleichbar mit MX/SPF-Records), keine Geheimnisse.
apiVersion: v1
kind: ConfigMap
metadata: {name: mail-autoconfig-xml, namespace: app-mail-autoconfig}
data:
  config-v1.1.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <clientConfig version="1.1">
      <emailProvider id="sedware.net">
        <domain>sedware.net</domain>
        <displayName>sedware.net Mail</displayName>
        <incomingServer type="imap">
          <hostname>stalwart.local.sedware.net</hostname>
          <port>993</port>
          <socketType>SSL</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </incomingServer>
        <outgoingServer type="smtp">
          <hostname>stalwart.local.sedware.net</hostname>
          <port>465</port>
          <socketType>SSL</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </outgoingServer>
      </emailProvider>
    </clientConfig>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mail-autoconfig, namespace: app-mail-autoconfig}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mail-autoconfig}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mail-autoconfig}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: httpd
        image: docker.io/rancher/mirrored-library-busybox:1.37.0@sha256:101b4afd76732482eff9b95cae5f94bcf295e521fbec4e01b69c5421f3f3f3e5
        command: [busybox, httpd, -f, -v, -p, "8080", -h, /www]
        ports:
        - {name: http, protocol: TCP, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /mail/config-v1.1.xml, port: http}
          initialDelaySeconds: 2
        livenessProbe:
          httpGet: {path: /mail/config-v1.1.xml, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 10m, memory: 16Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 100
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: config, mountPath: /www/mail}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap: {name: mail-autoconfig-xml}
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata: {name: mail-autoconfig, namespace: app-mail-autoconfig}
spec:
  selector: {app.kubernetes.io/name: mail-autoconfig}
  ports:
  - {name: http, port: 8080, targetPort: http}
---
# autoconfig.sedware.net besitzt keinen öffentlichen Cloudflare-Record (wie
# adguard.sedware.net) -- NetBird-Clients (und Pods im lokalen Cluster, deren
# DNS letztlich über denselben AdGuard-Pfad läuft) lösen den Namen über
# AdGuards Wildcard-Rewrite "*.sedware.net" auf die Overlay-IP von Host 1 auf
# und nutzen dort das gemeinsame Wildcard-TLS-Zertifikat am Envoy Edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: mail-autoconfig, namespace: app-mail-autoconfig}
spec:
  parentRefs:
  - {name: public, namespace: gateway-system, sectionName: https}
  hostnames: [autoconfig.sedware.net]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: mail-autoconfig, port: 8080}
---
# Gleiche Begründung wie bei AdGuard: ohne öffentlichen DNS-Record ist der Name
# zwar nicht auffindbar, aber der Envoy-Edge-Listener selbst ist auch über die
# echte Public-IP mit passender SNI erreichbar. Inhalt ist unkritisch (keine
# Secrets), aber konsistent auf NetBird beschränkt statt unnötig offen zu lassen.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata: {name: mail-autoconfig-netbird-only, namespace: app-mail-autoconfig}
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: mail-autoconfig}
  authorization:
    defaultAction: Deny
    rules:
    - action: Allow
      principal:
        clientCIDRs:
        - 100.64.0.0/10
