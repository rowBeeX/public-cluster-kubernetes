# Eigenes Namespace-Zertifikat statt des gateway-system-Wildcard-Secrets:
# keine clusterübergreifende Wiederverwendung von Secrets.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: mail-edge-tls, namespace: app-mailedge}
spec:
  secretName: mail-edge-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - mail.sedware.net
    # SAN des Smarthost-Peers, den Stalwart anspricht — ohne ihn bräuchte
    # Stalwart eine allowInvalidCerts-Ausnahme. Ein Umschwenken auf Host 2
    # verlangt zusätzlich dessen SAN (siehe README.md).
    - public-cluster-host-1.nb.sedware.net
---
# Der einzige Internet-Mail-Ein-/Ausgang, über Cilium Node IPAM auf beiden
# Gateway-Node-Adressen. Envoy bedient separat nur den privaten
# Smarthost-Port :2525 über NetBird.
apiVersion: v1
kind: Service
metadata:
  name: mail-edge-smtp
  namespace: app-mailedge
  annotations:
    io.cilium.nodeipam/match-node-labels: gateway.sedware.net/enabled=true
spec:
  selector: {app.kubernetes.io/name: mail-edge}
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  allocateLoadBalancerNodePorts: false
  # Local, NICHT Cluster — sicherheitskritisch: Cluster SNAT-t quer
  # weitergeleitete Verbindungen auf eine Adresse aus POSTFIX_mynetworks und
  # macht damit jeden Internet-Absender vertrauenswürdig (live als offenes
  # Relay nachgewiesen). Setzt einen Pod auf JEDEM Gateway-Node voraus.
  externalTrafficPolicy: Local
  ports:
  - {name: smtp, protocol: TCP, port: 25, targetPort: smtp}
---
# StatefulSet statt Deployment: ein Postfix-Spool darf nicht geteilt werden,
# und jeder Gateway-Node braucht einen eigenen Pod, damit
# externalTrafficPolicy Local auf beiden Adressen liefert.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail-edge
  namespace: app-mailedge
  labels: {app.kubernetes.io/name: mail-edge}
spec:
  replicas: 2
  serviceName: mail-edge-smtp
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: mail-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mail-edge}
    spec:
      automountServiceAccountToken: false
      # Beide Gateway-Nodes, nicht nur die Control Plane: sonst bliebe der
      # zweite Node ohne lokalen Endpoint und lieferte mit Local kein :25 mehr.
      nodeSelector: {gateway.sedware.net/enabled: "true"}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app.kubernetes.io/name: mail-edge}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: postfix
        image: docker.io/boky/postfix:v5.1.0-ubuntu@sha256:df5e7d4508451b21f94472d3552b69a0e41ff8d295de76dd507c79b1e0f7b5ff
        env:
        # --- Eingehend: Internet :25 -> Mail Edge -> Local Stalwart -----------
        # Öffentlicher MX-Name dieses Edge; zugleich HELO-Name und SAN des
        # STARTTLS-Zertifikats oben.
        - {name: POSTFIX_myhostname, value: mail.sedware.net}
        # Setzt nur den From-Header der Unzustellbarkeitsmeldungen; der
        # Envelope-Sender bleibt leer (<>, RFC 5321), sonst Bounce-Schleifen.
        - {name: POSTFIX_bounce_template_file, value: /etc/postfix/bounce/bounce.cf}
        - {name: POSTFIX_relay_domains, value: sedware.net}
        # Eckige Klammern deaktivieren die MX-Auflösung; der stabile
        # NetBird-Peer-FQDN wird bei jeder Zustellung neu aufgelöst und ist
        # damit die GitOps-Quelle statt einer rohen Overlay-IP.
        - name: POSTFIX_transport_maps
          value: "inline:{ sedware.net=smtp:[beelink-server.nb.sedware.net]:25 }"
        - {name: ALLOW_EMPTY_SENDER_DOMAINS, value: "true"}
        - {name: POSTFIX_inet_protocols, value: ipv4}
        # Dieser Host ist für keine Mail das Endziel: sedware.net ist Relay-,
        # keine Mailbox-Domain. Ohne diese Zeile bliebe der Postfix-Default
        # "$myhostname, localhost.$mydomain, localhost" stehen und Mail an
        # <unix-user>@mail.sedware.net verschwände in einer Container-Mailbox,
        # die niemand liest. Ein leerer Wert geht nicht: das boky-Image löscht
        # bei leerem POSTFIX_*-Wert den Parameter und stellt damit genau diesen
        # Default wieder her.
        - {name: POSTFIX_mydestination, value: localhost}
        # --- Ausgehender Relay-Trust (Anti-Open-Relay-Gate #2/#3) ------------
        # Quellen, die an beliebige Internet-Ziele relayen dürfen. Nur Loopback
        # plus die beiden Node-PodCIDRs, aus denen die CiliumInternalIP des
        # hostNetwork-Envoy stammt, über den der Stalwart-Smarthost eintrifft —
        # NICHT das ganze /16 (sonst relayt jeder Pod im Cluster) und nicht
        # 100.64.0.0/10 (das wäre das gesamte NetBird-Overlay). Warum
        # 10.42.1.0/24 trotz Einzel-Peer-Pfad dabeisteht: siehe README.md.
        - name: POSTFIX_mynetworks
          value: "127.0.0.0/8 [::1]/128 10.42.0.0/24 10.42.1.0/24"
        - {name: POSTFIX_smtpd_client_restrictions, value: "permit"}
        # ZWINGEND: der Image-Default "permit_mynetworks, reject" wiese die
        # gesamte eingehende Internet-Mail ab, obwohl der MX hierher zeigt. Der
        # Anti-Open-Relay-Schutz hängt an smtpd_relay_restrictions, nicht hier.
        - {name: POSTFIX_smtpd_sender_restrictions, value: "permit_mynetworks, reject_unknown_sender_domain"}
        # Kein SASL und kein öffentlicher Login: Relay nur per permit_mynetworks.
        - {name: POSTFIX_smtpd_relay_restrictions, value: "permit_mynetworks reject_unauth_destination"}
        # Unbekannte Empfänger in sedware.net schon beim RCPT abweisen statt
        # anzunehmen und später zu bouncen (Backscatter = Blocklist-Risiko für
        # beide Public-IPs, und die Annahme verrät gültige Adressen nicht).
        # Bewusst KEINE relay_recipient_maps: eine zweite Empfängerliste würde
        # gegen die Stalwart-Mailboxen driften. Postfix fragt stattdessen bei
        # jedem unbekannten Empfänger über transport_maps oben bei Stalwart
        # selbst nach (Stalwart antwortet "550 5.1.2 Mailbox does not exist").
        # permit_mynetworks steht davor: der ausgehende Smarthost-Pfad
        # adressiert externe Ziele, für die es nichts zu verifizieren gibt.
        - {name: POSTFIX_smtpd_recipient_restrictions, value: "permit_mynetworks, reject_unverified_recipient"}
        # Default wäre 450: ein nachweislich nicht existierender Empfänger
        # bekommt sonst fünf Tage lang Zustellversuche. Ein AUSFALL von Stalwart
        # fällt nicht hierunter — die Probe endet dann "unknown" und
        # unverified_recipient_tempfail_action (defer_if_permit) antwortet 4xx.
        - {name: POSTFIX_unverified_recipient_reject_code, value: "550"}
        # VRFY ist hier nur ein Werkzeug zur Adressen-Enumeration.
        - {name: POSTFIX_disable_vrfy_command, value: "yes"}
        # Der Default "$myhostname ESMTP $mail_name (Ubuntu)" nennt Distribution
        # und MTA; RFC 5321 verlangt nur den FQDN am Anfang.
        - {name: POSTFIX_smtpd_banner, value: "mail.sedware.net ESMTP"}
        # Opportunistisches STARTTLS auf :25 mit dem cert-manager-Zertifikat.
        - {name: POSTFIX_smtpd_tls_security_level, value: may}
        - {name: POSTFIX_smtpd_tls_cert_file, value: /etc/postfix/tls/tls.crt}
        - {name: POSTFIX_smtpd_tls_key_file, value: /etc/postfix/tls/tls.key}
        # Opportunistisches TLS bei ausgehender Zustellung zu externen MX-Hosts.
        - {name: POSTFIX_smtp_tls_security_level, value: may}
        ports:
        - {name: smtp, containerPort: 25, protocol: TCP}
        # Kein tcpSocket: der kubelet oeffnet dabei eine Verbindung und schliesst
        # sie ohne ein Wort wieder, was Postfix als "lost connection after
        # CONNECT" protokolliert — gemessen 23.040 Zeilen pro Tag, 32 % des
        # gesamten mail-edge-Logs. Echte Auffaelligkeiten (NOQUEUE-Rejects,
        # abgebrochene EHLO) gehen darin unter.
        #
        # Die exec-Probe fuehrt stattdessen einen ordentlichen SMTP-Abschluss:
        # sie liest das 220-Banner und verabschiedet sich mit QUIT. Damit
        # prueft sie zugleich mehr als der Portcheck — ein Postfix, der lauscht
        # aber kein Banner mehr sendet, faellt jetzt auf.
        #
        # Am 2026-08-17 im laufenden Pod gegengeprueft: dreimal rc=0 gegen :25,
        # rc=1 gegen einen toten Port. nc, timeout und sh liegen im Image.
        readinessProbe:
          exec:
            command: ['/bin/sh', '-c', 'printf "QUIT\r\n" | timeout 5 nc 127.0.0.1 25 | grep -q "^220 "']
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ['/bin/sh', '-c', 'printf "QUIT\r\n" | timeout 5 nc 127.0.0.1 25 | grep -q "^220 "']
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests: {cpu: 100m, memory: 128Mi}
        securityContext:
          # UID 0 und beschreibbares Root-FS sind beim boky-Image unvermeidbar
          # (siehe docs/exceptions.md). Deshalb hier alle Capabilities weg und
          # nur die tatsächlich benötigten zurück.
          allowPrivilegeEscalation: false
          seccompProfile: {type: RuntimeDefault}
          capabilities:
            drop: [ALL]
            add:
            - CHOWN            # Eigentümer von Spool-/Queue-Dateien anpassen
            - DAC_OVERRIDE     # Root-Master greift auf Postfix-Spool zu
            - FOWNER           # Berechtigungen von Spool-/Queue-Dateien verwalten
            - SETGID           # Child-Prozesse auf postfix/postdrop-Gruppen absenken
            - SETUID           # Privilege-separierte Daemons auf postfix-User absenken
            - NET_BIND_SERVICE # Port :25 binden
            - KILL             # Child-Daemons signalisieren
            - SYS_CHROOT       # smtpd-/cleanup-Daemons in chroot ausführen
        volumeMounts:
        - {name: spool, mountPath: /var/spool/postfix}
        - {name: tls, mountPath: /etc/postfix/tls, readOnly: true}
        - {name: bounce-template, mountPath: /etc/postfix/bounce, readOnly: true}
        # subPath, nicht das ganze Verzeichnis: /etc/rsyslog.d/postfix.conf des
        # Images meldet den chroot-Log-Socket an und muss erhalten bleiben.
        - {name: rsyslog, mountPath: /etc/rsyslog.d/50-default.conf, subPath: 50-default.conf, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: mail-edge-tls}
      - name: bounce-template
        configMap: {name: mail-edge-bounce-template}
      - name: rsyslog
        configMap: {name: mail-edge-rsyslog}
  # Dauerhafter Queue-Spool je Pod: ein Mail-Relay stellt bei vorübergehend
  # unerreichbaren Zielen zurück, die Queue muss Pod-Restarts überstehen.
  volumeClaimTemplates:
  - metadata: {name: spool}
    spec:
      accessModes: [ReadWriteOnce]
      # Reclaim Retain: hier liegt die Postfix-Queue, bei Verlust gehen
      # angenommene, aber noch nicht ausgelieferte Mails verloren.
      storageClassName: public-primary-super-fast
      resources:
        requests: {storage: 2Gi}
