# STARTTLS-Zertifikat für den SMTP-Edge per DNS-01 und gemeinsamem
# letsencrypt-ClusterIssuer. Das dedizierte Namespace-Zertifikat vermeidet
# eine clusterübergreifende Wiederverwendung des gateway-system-Wildcard-Secrets.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: mail-edge-tls, namespace: app-mailedge}
spec:
  secretName: mail-edge-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - mail.sedware.net
    # Stalwart verbindet sich über diesen NetBird-Peer-FQDN. Der zusätzliche SAN
    # erlaubt eine vollständige STARTTLS-Prüfung ohne allowInvalidCerts-Ausnahme.
    - public-cluster-host-1.nb.sedware.net
---
# Öffentlicher SMTP-Eingang über Cilium Node IPAM auf den Gateway-Node-Adressen.
# Dies ist der einzige Internet-Mail-Ein-/Ausgang; Envoy bedient separat nur den
# privaten Smarthost-Port :2525 über NetBird.
apiVersion: v1
kind: Service
metadata:
  name: mail-edge-smtp
  namespace: app-mailedge
  annotations:
    io.cilium.nodeipam/match-node-labels: gateway.sedware.net/enabled=true
spec:
  selector: {app.kubernetes.io/name: mail-edge}
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  allocateLoadBalancerNodePorts: false
  # Local, NICHT Cluster — sicherheitskritisch. Bei Cluster wird eine Verbindung,
  # die auf einem Node ohne lokalen Pod ankommt, quer weitergeleitet und dabei
  # SNAT-t: Postfix sieht als Quelle dann eine Adresse aus dem Pod-CIDR jenes
  # Nodes. Genau diese CIDRs stehen weiter unten in POSTFIX_mynetworks, damit
  # der Smarthost-Pfad von Stalwart über Envoy relayen darf — womit jeder
  # beliebige Internet-Absender über diesen Node als vertrauenswürdig gälte.
  # Live nachgewiesen: RCPT an eine externe Domain wurde über host-2 mit 250
  # angenommen, also ein offenes Relay. Local erhält die Client-IP und schließt
  # das; Voraussetzung ist ein Pod auf JEDEM Gateway-Node (siehe StatefulSet).
  externalTrafficPolicy: Local
  ports:
  - {name: smtp, protocol: TCP, port: 25, targetPort: smtp}
---
# StatefulSet statt Deployment: ein Postfix-Spool darf nicht geteilt werden, und
# jeder Gateway-Node braucht einen eigenen Pod, damit externalTrafficPolicy
# Local auf beiden Adressen liefert. volumeClaimTemplates gibt jedem Pod seine
# eigene RWO-Queue; die beiden Warteschlangen sind unabhängig, wie bei zwei
# gleichrangigen MX üblich.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail-edge
  namespace: app-mailedge
  labels: {app.kubernetes.io/name: mail-edge}
spec:
  replicas: 2
  serviceName: mail-edge-smtp
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: mail-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mail-edge}
    spec:
      automountServiceAccountToken: false
      # Beide Gateway-Nodes, nicht nur die Control Plane: sonst bliebe der
      # zweite Node ohne lokalen Endpoint und lieferte mit Local kein :25 mehr.
      nodeSelector: {gateway.sedware.net/enabled: "true"}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app.kubernetes.io/name: mail-edge}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: postfix
        image: docker.io/boky/postfix:v5.1.0-ubuntu@sha256:df5e7d4508451b21f94472d3552b69a0e41ff8d295de76dd507c79b1e0f7b5ff
        env:
        # --- Eingehend: Internet :25 -> Mail Edge -> Local Stalwart -----------
        # Öffentlicher MX-Name dieses Edge; zugleich HELO-Name und SAN des
        # STARTTLS-Zertifikats oben.
        - {name: POSTFIX_myhostname, value: mail.sedware.net}
        # Nachrichten an sedware.net annehmen ...
        - {name: POSTFIX_relay_domains, value: sedware.net}
        # ... und über den mail-smtp-Listener des Local Private Edge an Stalwart
        # weiterleiten. Eckige Klammern deaktivieren die MX-Auflösung; Postfix
        # löst den stabilen Peer-FQDN bei jeder Zustellung zur aktuellen Overlay-
        # IP auf. Dieser FQDN statt einer rohen Overlay-IP ist die GitOps-Quelle.
        # Der :25-TCPRoute am Local Cluster führt zum Stalwart-ClusterIP.
        - name: POSTFIX_transport_maps
          value: "inline:{ sedware.net=smtp:[beelink-server.nb.sedware.net]:25 }"
        # Empfängerbegrenztes Relay: Internet-MX-Absender bleiben zulässig
        # (siehe smtpd_sender_restrictions weiter unten); relay_domains und
        # mynetworks autorisieren Empfänger beziehungsweise Quelle.
        - {name: ALLOW_EMPTY_SENDER_DOMAINS, value: "true"}
        - {name: POSTFIX_inet_protocols, value: ipv4}
        # Dieser Host ist für keine Domain das Endziel. sedware.net ist eine
        # Relay-Domain, die an Stalwart weitergeleitet wird, keine lokale
        # Mailbox-Domain.
        - {name: POSTFIX_mydestination, value: ""}
        # --- Ausgehender Relay-Trust (Anti-Open-Relay-Gate) ------------------
        # mynetworks begrenzt Quellen, die an beliebige Internet-Ziele relayen
        # dürfen. Das frühere 100.64.0.0/10 hätte jedem NetBird-/CGNAT-Peer
        # vertraut und damit ein Open-Relay-Risiko erzeugt (#2/#3).
        #
        # Der Smarthost-Pfad endet am hostNetwork-Envoy auf Public Host 1. Beim
        # Zugriff auf den ClusterIP wird dessen Quelle auf die CiliumInternalIP
        # aus dem stabilen Server-Node-PodCIDR 10.42.0.0/24 umgesetzt. Nur dieses
        # /24 wird vertraut; Host 2 nutzt 10.42.1.0/24. Die CiliumNetworkPolicy
        # erlaubt am Backend zusätzlich ausschließlich host/remote-node sowie
        # den öffentlichen MX-Pfad. NetBird-Policy und Interface-Firewall
        # begrenzen den Zugang zu Envoy :2525 auf den Stalwart-Peer.
        # Beide Public-Hosts sind gleichwertig und stehen im DNS-Round-Robin;
        # der Smarthost-Pfad kann daher am Envoy jedes der beiden Nodes ankommen.
        # k3s vergibt die Node-PodCIDRs der Reihe nach aus 10.42.0.0/16: Host 1
        # bekommt 10.42.0.0/24, Host 2 10.42.1.0/24. Beide /24 werden vertraut,
        # nicht das ganze /16 — sonst dürfte jeder Pod im Cluster nach außen
        # relayen. Das frühere 100.64.0.0/10 hätte jedem NetBird-/CGNAT-Peer
        # vertraut und damit ein Open-Relay-Risiko erzeugt (#2/#3).
        - name: POSTFIX_mynetworks
          value: "127.0.0.0/8 [::1]/128 10.42.0.0/24 10.42.1.0/24"
        # Internet-MX-Sender müssen eine SMTP-Session beginnen dürfen. Die
        # Empfänger-/Relay-Autorisierung erfolgt darunter separat und verweigert
        # externe Ziele weiterhin für alle nicht vertrauenswürdigen Quellen.
        - {name: POSTFIX_smtpd_client_restrictions, value: "permit"}
        # ZWINGEND: der Image-Default ist "permit_mynetworks, reject" und weist
        # damit JEDEN Absender ab, der nicht aus mynetworks kommt — also die
        # gesamte eingehende Internet-Mail, obwohl der MX hierher zeigt. Der
        # Anti-Open-Relay-Schutz hängt an smtpd_relay_restrictions
        # (reject_unauth_destination), nicht an dieser Liste; sie darf externe
        # Absender deshalb zulassen. reject_unknown_sender_domain hält Absender
        # mit nicht auflösbarer Domain draußen, ohne legitime MX-Sender zu
        # treffen.
        - {name: POSTFIX_smtpd_sender_restrictions, value: "permit_mynetworks, reject_unknown_sender_domain"}
        # Kein SASL und kein öffentlicher Login: Relay nur per permit_mynetworks.
        - {name: POSTFIX_smtpd_relay_restrictions, value: "permit_mynetworks reject_unauth_destination"}
        # Opportunistisches STARTTLS auf :25 mit dem cert-manager-Zertifikat.
        - {name: POSTFIX_smtpd_tls_security_level, value: may}
        - {name: POSTFIX_smtpd_tls_cert_file, value: /etc/postfix/tls/tls.crt}
        - {name: POSTFIX_smtpd_tls_key_file, value: /etc/postfix/tls/tls.key}
        # Opportunistisches TLS bei ausgehender Zustellung zu externen MX-Hosts.
        - {name: POSTFIX_smtp_tls_security_level, value: may}
        ports:
        - {name: smtp, containerPort: 25, protocol: TCP}
        readinessProbe:
          tcpSocket: {port: smtp}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: smtp}
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests: {cpu: 100m, memory: 128Mi}
        securityContext:
          # Der privilege-separierte Postfix-Master benötigt UID 0; außerdem
          # erzeugt das boky-Image /etc/postfix beim Start neu. runAsNonRoot und
          # readOnlyRootFilesystem sind daher nicht erreichbar (siehe Exceptions).
          # #11: Alle Capabilities entfernen und nur tatsächlich benötigte wieder
          # ergänzen; NET_RAW, MKNOD, AUDIT_WRITE, SETFCAP, SETPCAP und FSETID entfallen.
          allowPrivilegeEscalation: false
          seccompProfile: {type: RuntimeDefault}
          capabilities:
            drop: [ALL]
            add:
            - CHOWN            # Eigentümer von Spool-/Queue-Dateien anpassen
            - DAC_OVERRIDE     # Root-Master greift auf Postfix-Spool zu
            - FOWNER           # Berechtigungen von Spool-/Queue-Dateien verwalten
            - SETGID           # Child-Prozesse auf postfix/postdrop-Gruppen absenken
            - SETUID           # Privilege-separierte Daemons auf postfix-User absenken
            - NET_BIND_SERVICE # Port :25 binden
            - KILL             # Child-Daemons signalisieren
            - SYS_CHROOT       # smtpd-/cleanup-Daemons in chroot ausführen
        volumeMounts:
        - {name: spool, mountPath: /var/spool/postfix}
        - {name: tls, mountPath: /etc/postfix/tls, readOnly: true}
      volumes:
      - name: tls
        secret: {secretName: mail-edge-tls}
  # Dauerhafter Queue-Spool je Pod: ein Mail-Relay stellt bei vorübergehend
  # unerreichbaren Zielen zurück, die Queue muss Pod-Restarts überstehen.
  volumeClaimTemplates:
  - metadata: {name: spool}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests: {storage: 2Gi}
