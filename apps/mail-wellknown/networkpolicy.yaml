apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: default-deny, namespace: app-mail-wellknown}
spec:
  endpointSelector: {}
  # Leere ingress:[]/egress:[]-Arrays verwirft Cilium (Valid=False = No-op). Die
  # gültige Default-Deny-Form selektiert eine leere Endpoint-Menge, wodurch der
  # Endpoint in beide Richtungen in Default-Deny fällt.
  ingress:
    - fromEndpoints: []
  egress:
    - toEndpoints: []
---
# Nur der Public Envoy Edge erreicht den Pod; der Pod selbst braucht keinerlei
# Egress (reine statische Auslieferung, keine ausgehenden Verbindungen).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: allow-gateway-ingress, namespace: app-mail-wellknown}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mail-wellknown
  ingress:
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
