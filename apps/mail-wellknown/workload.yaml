# Hintergrund und Exposition: siehe README.md.
# Inhalt MUSS mit local-cluster-kubernetes/apps/mail-autoconfig/
# mail-autoconfig-config/config-v1.1.xml synchron bleiben.
apiVersion: v1
kind: ConfigMap
metadata: {name: mail-wellknown-config, namespace: app-mail-wellknown}
data:
  # busybox httpd liest /etc/httpd.conf auch ohne -c. Seine eingebaute
  # MIME-Tabelle kennt .xml NICHT, die Antwort ging deshalb ganz ohne
  # Content-Type raus. Thunderbird fuellt responseXML dann nicht und meldet
  # "Die Konfigurationsdatei enthaelt nicht die notwendigen Angaben in XML",
  # obwohl das Dokument korrekt und vollstaendig ist.
  httpd.conf: |
    .xml:text/xml
  config-v1.1.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <clientConfig version="1.1">
      <emailProvider id="sedware.net">
        <domain>sedware.net</domain>
        <displayName>sedware.net Mail</displayName>
        <displayShortName>sedware.net</displayShortName>
        <incomingServer type="imap">
          <hostname>stalwart.local.sedware.net</hostname>
          <port>993</port>
          <socketType>SSL</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </incomingServer>
        <outgoingServer type="smtp">
          <hostname>stalwart.local.sedware.net</hostname>
          <port>465</port>
          <socketType>SSL</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </outgoingServer>
      </emailProvider>
    </clientConfig>
  # Outlook und Thunderbird fragen VOR der Apex-.well-known-URL auch
  # /autodiscover/autodiscover.xml am Apex ab. Ohne eigene Route fiel das in
  # den Apex-Catch-All auf Authentik: gemessen 301 -> authentik.sedware.net ->
  # 404/405. Dieser Exchange-Fehlerstub ist die korrekte Antwort ("hier ist
  # kein Exchange") und beendet den Versuch sauber, statt den Client auf einen
  # fremden Host zu schicken. Inhalt identisch mit
  # local-cluster-kubernetes/apps/mail-autoconfig/mail-autoconfig-config/autodiscover.xml.
  autodiscover.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <Autodiscover xmlns="http://schemas.microsoft.com/exchange/autodiscover/responseschema/2006">
      <Response xmlns="http://schemas.microsoft.com/exchange/autodiscover/outlook/responseschema/2006a">
        <Error Time="00:00:00" Id="0">
          <ErrorCode>600</ErrorCode>
          <Message>Invalid Request</Message>
          <DebugData/>
        </Error>
      </Response>
    </Autodiscover>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mail-wellknown, namespace: app-mail-wellknown}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: mail-wellknown}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mail-wellknown}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: httpd
        image: docker.io/rancher/mirrored-library-busybox:1.37.0@sha256:101b4afd76732482eff9b95cae5f94bcf295e521fbec4e01b69c5421f3f3f3e5
        command: [busybox, httpd, -f, -v, -p, "8080", -h, /www]
        ports:
        - {name: http, protocol: TCP, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /.well-known/autoconfig/mail/config-v1.1.xml, port: http}
          initialDelaySeconds: 2
        livenessProbe:
          httpGet: {path: /.well-known/autoconfig/mail/config-v1.1.xml, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 10m, memory: 16Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 100
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
        - {name: config, mountPath: /www/.well-known/autoconfig/mail/config-v1.1.xml, subPath: config-v1.1.xml}
        - {name: config, mountPath: /www/autodiscover/autodiscover.xml, subPath: autodiscover.xml}
        - {name: config, mountPath: /etc/httpd.conf, subPath: httpd.conf}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap: {name: mail-wellknown-config}
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata: {name: mail-wellknown, namespace: app-mail-wellknown}
spec:
  selector: {app.kubernetes.io/name: mail-wellknown}
  ports:
  - {name: http, port: 8080, targetPort: http}
---
# Exact-Match statt PathPrefix: höchste Gateway-API-Präzedenz (schlägt den
# pfadlosen Catch-all von apex-to-authentik) und deckt bewusst nur genau diese
# eine Datei ab, nicht mehr.
#
# NUR apex-https: hinge die Route auch am apex-http-Listener, lieferte der Edge
# die XML im Klartext aus (nachgewiesen: 200 statt 301). Die Datei nennt die
# Hostnamen und den Auth-Mechanismus, denen ein Mail-Client vertrauen soll —
# über HTTP ist sie manipulierbar. Port 80 am Apex gehört dem
# HTTP->HTTPS-Redirect in public-cluster-nix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: mail-wellknown, namespace: app-mail-wellknown}
spec:
  parentRefs:
  - {name: public, namespace: gateway-system, sectionName: apex-https}
  hostnames: [sedware.net]
  rules:
  - matches:
    - path: {type: Exact, value: /.well-known/autoconfig/mail/config-v1.1.xml}
    - path: {type: Exact, value: /autodiscover/autodiscover.xml}
    - path: {type: Exact, value: /Autodiscover/Autodiscover.xml}
    backendRefs:
    - {name: mail-wellknown, port: 8080}
