# Zentrales CloudNativePG-PostgreSQL des Public-Clusters. Authentik ist die erste
# Datenbank; weitere verwaltete Rollen und Datenbanken können folgen. Die einzelne
# Instanz läuft knotenlokal auf dem Control-Plane-Node; Authentik wird per
# podAntiAffinity bewusst auf den anderen Knoten gelegt (apps/authentik).
# Fortlaufende Backups gehen über NetBird zum lokalen RustFS-S3.
apiVersion: v1
kind: Namespace
metadata:
  name: app-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/part-of: public-cluster
    app.kubernetes.io/managed-by: argocd
    core.sedware.net/owner: platform
    core.sedware.net/purpose: application
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: app-postgresql}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: app-postgresql}
spec:
  hard:
    # Cluster-Instanz (100m/256Mi, workload.yaml) plus Barman-Cloud-Sidecar
    # (20m/64Mi, ObjectStore instanceSidecarConfiguration) plus Reserve für
    # den Seed-Job (LimitRange-Default 50m/128Mi) und künftige Consumer-Rollen.
    requests.cpu: "500m"
    requests.memory: 768Mi
    requests.storage: 20Gi
    persistentvolumeclaims: "2"
    pods: "6"
